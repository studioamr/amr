<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:1400px;height:1400px;overflow:hidden;background:#081617}
  .cover{position:relative;width:1400px;height:1400px;background:radial-gradient(120% 90% at 50% 38%,#123032 0%,#0D1E1F 55%,#081617 100%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-sizing:border-box;padding:90px 0 100px}
  .stars{position:absolute;inset:0}
  .kicker{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.32em;text-transform:uppercase;color:#5ED4DE;opacity:.9;text-align:center;z-index:2}
  .kicker b{color:#EAE6DF}
  .mush{z-index:2;filter:drop-shadow(0 0 60px rgba(94,212,222,.35))}
  .title{font-family:'Instrument Serif',serif;font-weight:400;font-size:190px;letter-spacing:.04em;color:#EAE6DF;text-align:center;line-height:.85;z-index:2}
  .sub{font-family:'IBM Plex Mono',monospace;font-size:19px;letter-spacing:.22em;text-transform:uppercase;color:#5ED4DE;opacity:.75;margin-top:22px;z-index:2}
</style></head>
<body>
<div class="cover">

  <div>
    <div class="title">MICELIO</div>
    <div class="sub">Eight nights &middot; one continuous mix</div>
  </div>
</div>
<script>
  var s = document.querySelector('.stars'), n = 90, ns = 'http://www.w3.org/2000/svg';
  for (var i = 0; i < n; i++) {
    var c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', Math.random() * 1400);
    c.setAttribute('cy', Math.random() * 620);
    c.setAttribute('r', (Math.random() * 1.6 + 0.4).toFixed(2));
    c.setAttribute('fill', '#EAE6DF');
    c.setAttribute('opacity', (Math.random() * 0.5 + 0.15).toFixed(2));
    s.appendChild(c);
  }
</script>
</body></html>
